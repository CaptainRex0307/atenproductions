# Adds photos dropped into media/collection/ to The Collection automatically.
# Triggered by uploads/deletes in that folder (e.g. Pages CMS → Media → Collection photos).
name: Sync collection photos

on:
  push:
    branches: [main]
    paths: ["media/collection/**"]
  workflow_dispatch: {}

permissions:
  contents: write   # commit the updated photo list / resized photos
  pages: write      # ask GitHub Pages to rebuild afterwards

concurrency:
  group: sync-collection
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install --quiet --disable-pip-version-check pillow pillow-heif

      # Pages CMS saves each dropped photo as its own commit, so several runs can start at once.
      # Each attempt starts from the newest main and redoes the (idempotent) sync, so runs never
      # have to merge each other's changes, and nothing the owner saved in the CMS is lost.
      - name: Sync photo list and commit
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --quiet --hard FETCH_HEAD
            python .github/scripts/sync_collection.py .
            if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard media/collection)" ]; then
              echo "Nothing to commit"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            git add content/photo.json media/collection
            git commit --quiet -m "Add new photos to the collection"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "main moved while syncing (attempt $attempt), starting again from the latest version"
            sleep $((attempt * 3))
          done
          echo "::error::Could not save the photo list after 5 attempts"; exit 1

      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages will rebuild on the next push"
