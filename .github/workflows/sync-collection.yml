# Adds photos dropped into media/collection/ to The Collection automatically.
# Triggered by uploads/deletes in that folder (e.g. Pages CMS → Media → Collection photos).
name: Sync collection photos

on:
  push:
    branches: [main]
    paths: ["media/collection/**"]
  workflow_dispatch: {}

permissions:
  contents: write   # commit the updated photo list / resized photos
  pages: write      # ask GitHub Pages to rebuild afterwards

concurrency:
  group: sync-collection
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install --quiet pillow

      - name: Sync photo list
        run: python .github/scripts/sync_collection.py .

      - name: Commit changes
        id: commit
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/photo.json media/collection
          git commit -m "Add new photos to the collection"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages will rebuild on the next push"
