# Pages CMS configuration: https://pagescms.org
# Sign in at https://app.pagescms.org with GitHub, pick this repo, and you get
# simple forms for everything below. Saving commits to GitHub and the site
# rebuilds automatically.

media:
  # Drag photos in here (Media → Collection photos) and they're added to The Collection automatically
  - name: collection
    label: Collection photos (drop photos here)
    input: media/collection
    output: /media/collection
    extensions: [jpg, jpeg, png, webp]
  # Everything else: project stills, portrait, résumé PDF
  - name: files
    label: Other uploads
    input: media
    output: /media

content:
  # ---------------------------------------------------------------
  - name: aten
    label: "Aten Productions (main site)"
    type: file
    path: content/aten.json
    fields:
      - name: name
        label: Your name
        type: string
      - name: hero_text
        label: Intro (top of the page)
        description: Shown after "I'm [your name]."
        type: text
      - name: contact
        label: Contact info
        type: object
        fields:
          - { name: email, label: Email, type: string }
          - { name: phone, label: Phone, type: string }
          - { name: location, label: Based in, type: string }
          - name: socials
            label: Social links
            type: object
            list: true
            fields:
              - { name: label, label: "Name (e.g. LinkedIn)", type: string }
              - { name: url, label: "Link (https://...)", type: string }
      - name: projects
        label: Projects (Selected Work)
        type: object
        list: true
        fields:
          - { name: title, label: Project name, type: string }
          - { name: year, label: Year, type: string }
          - { name: category, label: "Type (e.g. Live Event)", type: string }
          - { name: description, label: Description / your role, type: text }
          - { name: tags, label: Tags, type: string, list: true }
          - { name: image, label: Photo or still, type: image, options: { media: files } }
      - name: services
        label: Services
        type: object
        list: true
        fields:
          - name: icon
            label: Icon
            type: select
            options:
              values: ["Eye of Horus", "Ankh", "Djed pillar", "Sun disk", "Scarab", "Feather", "Lotus", "Owl"]
          - { name: title, label: Title, type: string }
          - { name: text, label: Description, type: text }
      - name: gear
        label: The Rig (gear & skills)
        type: object
        list: true
        fields:
          - { name: category, label: "Category (e.g. Switchers)", type: string }
          - { name: items, label: Items, type: string, list: true }
      - name: about
        label: About me
        description: Leave a blank line between paragraphs.
        type: text
      - name: resume
        label: Résumé (PDF)
        description: Leave empty to hide the Download Résumé button.
        type: file
        options: { media: files }
      - name: timeline
        label: Experience timeline
        type: object
        list: true
        fields:
          - { name: dates, label: "Dates (e.g. 2022 — 2024)", type: string }
          - { name: title, label: "Role, Company", type: string }
          - { name: text, label: One-line summary, type: string }
      - name: monitor
        label: Broadcast readout (hero corner)
        type: object
        fields:
          - { name: format, label: Format, type: string }
          - { name: link, label: Link, type: string }

  # ---------------------------------------------------------------
  - name: photo
    label: "Dylan's Collection (photo site)"
    type: file
    path: content/photo.json
    fields:
      - name: photos
        label: Photos (The Collection)
        description: "Photos dropped into Media → Collection photos appear here on their own within a minute or two. Use this list to add titles, categories and Trophy Room ticks. To remove a photo, delete its file in Media. Top of the list = No. 001."
        type: object
        list: true
        fields:
          - { name: image, label: Photo, type: image, options: { media: collection } }
          - name: number
            label: Piece No.
            description: "Sets the order: No. 1 shows first. New photos get the next number automatically. Change it to move a photo."
            type: number
          - { name: title, label: Name / title, type: string }
          - { name: character, label: "Character (e.g. Makima)", type: string }
          - { name: cosplayer, label: "Cosplayer name", type: string }
          - name: cosplayer_instagram
            label: Cosplayer Instagram
            description: "Their @handle or Instagram link (e.g. @rem.cos or instagram.com/rem.cos). Their name on the site links to it."
            type: string
          - name: date
            label: Date shot
            description: "Any format you like: 2026.10, Oct 31 2026, Halloween 2026... Filled in from the photo when it's added; change it freely."
            type: string
          - { name: convention, label: "Convention (e.g. Anime Expo 2026)", type: string }
          - { name: category, label: "Category (e.g. Night, Street, Portraits, Cosplay)", type: string }
          - { name: trophy, label: In the Trophy Room, type: boolean }
          - name: shape
            label: Panel shape
            description: "Boxes are Instagram 4:5. Auto = portrait box, or a wide box if the photo is landscape. Big = 2×2 feature. Wide = landscape."
            type: select
            options:
              values: ["auto", "portrait", "wide", "big"]
      - name: name
        label: Your name
        type: string
      - name: intro
        label: Intro (top of the page)
        type: text
      - name: bio
        label: Curator bio
        description: Leave a blank line between paragraphs.
        type: text
      - name: portrait
        label: Your portrait (optional)
        type: image
        options: { media: files }
      - name: dossier
        label: Curator dossier
        type: object
        list: true
        fields:
          - { name: label, label: "Label (e.g. Weapon of Choice)", type: string }
          - { name: value, label: Value, type: string }
      - name: contact
        label: Contact info
        type: object
        fields:
          - { name: email, label: Email, type: string }
          - name: socials
            label: Social links
            type: object
            list: true
            fields:
              - { name: label, label: "Name (e.g. Instagram)", type: string }
              - { name: url, label: "Link (https://...)", type: string }
      - name: booking
        label: Bookings (Book a Shoot page)
        type: object
        fields:
          - { name: intro, label: Text at the top of the page, type: text }
          - name: convention
            label: Convention bookings
            type: object
            fields:
              - { name: title, label: Button title, type: string }
              - { name: text, label: Short description, type: text }
              - name: form_url
                label: Google Form link (conventions)
                description: "In Google Forms click Send → link icon → untick 'Shorten URL' → Copy, and paste it here. Leave empty to hide this option."
                type: string
          - name: anytime
            label: Any-time bookings
            type: object
            fields:
              - { name: title, label: Button title, type: string }
              - { name: text, label: Short description, type: text }
              - name: form_url
                label: Google Form link (any time)
                description: "In Google Forms click Send → link icon → untick 'Shorten URL' → Copy, and paste it here. Leave empty to hide this option."
                type: string
